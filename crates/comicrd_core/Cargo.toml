[package]
name = "comicrd_core"
version = "1.6.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
unrar = "0.5.8"
# AVIF is decode-only in the app (`avif-native` = dav1d). The `avif`
# feature is the rav1e encoder and lives in dev-dependencies for the test
# fixtures only: it pulls 49 crates and ~27 s of cold compile into every
# release build otherwise.
image = { version = "0.25.10", default-features = false, features = [
  "avif-native",
  "png",
  "jpeg",
  "webp",
  "gif",
  "bmp",
] }
fast_image_resize = { version = "6.1.0", features = ["image"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["avif"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
