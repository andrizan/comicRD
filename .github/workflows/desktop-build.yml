name: Desktop Build

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    tags:
      - "v*"
  pull_request:

# Least privilege by default; only the release job writes.
permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Run Rust tests
        run: cargo test

      - name: Analyze Flutter app
        working-directory: app_flutter
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: app_flutter
        run: flutter test

  # Keeps the dav1d cache warm from master so tag builds skip the slow
  # meson build; the Windows job builds it itself if the cache is cold.
  cache-dav1d:
    name: Warm dav1d cache (Windows)
    needs: quality
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore or build dav1d
        uses: ./.github/actions/dav1d-windows

  build-linux:
    name: Build Linux Bundle
    needs: quality
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve version and bump pubspec
        id: version
        uses: ./.github/actions/release-version

      - name: Build Linux release tarball
        run: ./scripts/package-linux.sh "${{ steps.version.outputs.version }}"

      - name: Upload Linux tarball
        uses: actions/upload-artifact@v7
        with:
          name: comicrd-linux-x86_64
          path: dist/comicrd-*-linux-x86_64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows Bundle
    needs: quality
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Restore or build dav1d
        uses: ./.github/actions/dav1d-windows

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Resolve version and bump pubspec
        id: version
        uses: ./.github/actions/release-version

      - name: Build Windows release
        working-directory: app_flutter
        run: flutter build windows --release

      - name: Archive Windows bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path app_flutter/build/windows/x64/runner/Release/* `
            -DestinationPath "dist/comicrd-${{ steps.version.outputs.version }}-windows-x86_64.zip" `
            -Force

      - name: Build Windows installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /D"AppVersion=${{ steps.version.outputs.version }}" "app_flutter\windows\installer\comicrd-setup.iss"

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v7
        with:
          name: comicrd-windows-x86_64
          path: dist/comicrd-*-windows-x86_64.zip
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: comicrd-windows-installer
          path: dist/comicrd-*-windows-x86_64-setup.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS Bundle
    needs: quality
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Resolve version and bump pubspec
        id: version
        uses: ./.github/actions/release-version

      - name: Build macOS release
        working-directory: app_flutter
        run: flutter build macos --release

      - name: Archive macOS bundle
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            app_flutter/build/macos/Build/Products/Release/ComicRD.app \
            "dist/comicrd-${{ steps.version.outputs.version }}-macos.zip"

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v7
        with:
          name: comicrd-macos
          path: dist/comicrd-*-macos.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - build-linux
      - build-windows
      - build-macos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master
          # git-cliff needs the full history and tags to find the previous release.
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release-upload
          find release-artifacts -type f \( \
            -name "*.tar.gz" -o \
            -name "*.zip" -o \
            -name "*.exe" \
          \) -exec cp -v {} release-upload/ \;
          ls -la release-upload
          test "$(find release-upload -maxdepth 1 -type f | wc -l)" -gt 0

      - name: Resolve version
        id: version
        uses: ./.github/actions/release-version
        with:
          bump: "false"

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        env:
          OUTPUT: RELEASE_NOTES.md
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          name: ComicRD ${{ github.ref_name }}
          files: release-upload/*
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.version.outputs.prerelease }}

      - name: Commit version bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(grep '^version:' app_flutter/pubspec.yaml | sed 's/version: \([0-9][0-9.]*\).*/\1/')
          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "Version already matches tag ($VERSION). Skipping commit."
            exit 0
          fi
          BUILD=$(grep '^version:' app_flutter/pubspec.yaml | sed 's/.*+\([0-9]*\).*/\1/')
          NEW_BUILD=$((BUILD + 1))
          sed -i "s/^version: .*/version: ${VERSION}+${NEW_BUILD}/" app_flutter/pubspec.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app_flutter/pubspec.yaml
          git diff --cached --quiet && echo "No version change to commit" && exit 0
          git commit -m "chore: bump version to ${VERSION}+${NEW_BUILD} [skip ci]"
          git push origin master

  publish-aur:
    name: Publish to AUR
    needs: release
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') && !contains(github.ref_name, '_')
    runs-on: ubuntu-24.04

    steps:
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([A-Za-z][0-9A-Za-z._]*)?$'; then
            echo "Invalid tag: $TAG. Expected vX.Y.Z or vX.Y.Zsuffix."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Linux tarball checksum
        id: checksum
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/comicrd-${VERSION}-linux-x86_64.tar.gz"
          curl -fsSL "$URL" -o comicrd-linux.tar.gz
          SHA256="$(sha256sum comicrd-linux.tar.gz | awk '{print $1}')"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Install SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            HostName aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF

      - name: Clone AUR repository
        run: |
          set -euo pipefail
          git clone ssh://aur@aur.archlinux.org/comicrd-bin.git aur-repo

      - name: Generate PKGBUILD
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd aur-repo
          cat > PKGBUILD <<PKGEOF
          # Maintainer: Riski Andriyanto <putra7a@gmail.com>

          pkgname=comicrd-bin
          _pkgname=comicrd
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="ComicRD desktop comic reader built with Flutter and Rust"
          arch=('x86_64')
          url="https://github.com/${GITHUB_REPOSITORY}"
          license=('MIT')
          depends=(
            'gcc-libs'
            'glib2'
            'glibc'
            'gtk3'
            'hicolor-icon-theme'
            'libepoxy'
          )
          provides=('comicrd')
          conflicts=('comicrd')
          source=("\${_pkgname}-\${pkgver}-linux-x86_64.tar.gz::https://github.com/${GITHUB_REPOSITORY}/releases/download/v\${pkgver}/comicrd-\${pkgver}-linux-x86_64.tar.gz")
          sha256sums=('${SHA256}')

          package() {
            cp -R --no-preserve=ownership "\${srcdir}/comicrd-\${pkgver}-linux-x86_64/opt" "\${pkgdir}/"
            install -dm755 "\${pkgdir}/usr/bin"
            ln -sf /opt/comicrd/ComicRD "\${pkgdir}/usr/bin/comicrd"
            install -Dm644 "\${srcdir}/comicrd-\${pkgver}-linux-x86_64/usr/share/applications/com.andrizan.comicrd.desktop" "\${pkgdir}/usr/share/applications/com.andrizan.comicrd.desktop"
            install -Dm644 "\${srcdir}/comicrd-\${pkgver}-linux-x86_64/usr/share/icons/hicolor/512x512/apps/comicrd.png" "\${pkgdir}/usr/share/icons/hicolor/512x512/apps/comicrd.png"

            if [ -f "\${srcdir}/comicrd-\${pkgver}-linux-x86_64/usr/share/licenses/comicrd-bin/LICENSE" ]; then
              install -Dm644 "\${srcdir}/comicrd-\${pkgver}-linux-x86_64/usr/share/licenses/comicrd-bin/LICENSE" "\${pkgdir}/usr/share/licenses/comicrd-bin/LICENSE"
            fi
          }
          PKGEOF

      - name: Generate .SRCINFO
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/aur-repo:/aur-src:ro" \
            archlinux:latest \
            bash -lc "
              pacman -Syu --noconfirm base-devel >/dev/null &&
              useradd -m builder &&
              install -d -o builder -g builder /pkg &&
              install -m 644 /aur-src/PKGBUILD /pkg/PKGBUILD &&
              chown builder:builder /pkg/PKGBUILD &&
              su builder -c 'cd /pkg && makepkg --printsrcinfo'
            " > aur-repo/.SRCINFO
          cat aur-repo/.SRCINFO

      - name: Push to AUR
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd aur-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No AUR changes"
            exit 0
          fi
          git commit -m "Update to ${VERSION}"
          git push origin master
