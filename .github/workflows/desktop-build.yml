name: Desktop Build

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.8"
  APP_NAME: ComicRD

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            curl \
            file \
            git \
            libdav1d-dev \
            libgtk-3-dev \
            ninja-build \
            pkg-config \
            unzip \
            xz-utils

      - name: Fetch Flutter dependencies
        working-directory: app_flutter
        run: flutter pub get

      - name: Run Rust tests
        run: cargo test

      - name: Analyze Flutter app
        working-directory: app_flutter
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: app_flutter
        run: flutter test

  build-linux:
    name: Build Linux Bundle
    needs: quality
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            file \
            git \
            libdav1d-dev \
            libgtk-3-dev \
            ninja-build \
            pkg-config \
            xz-utils

      - name: Build Linux release tarball
        env:
          FLUTTER_BIN: flutter
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([A-Za-z][0-9A-Za-z._]*|[-_][0-9A-Za-z][0-9A-Za-z._-]*)?$'; then
            if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
              echo "Invalid tag: $GITHUB_REF_NAME. Expected vX.Y.Z, vX.Y.Zsuffix, vX.Y.Z_suffix, or vX.Y.Z-suffix."
              exit 1
            fi
            VERSION="manual-${GITHUB_RUN_NUMBER}"
          fi
          # Bump pubspec version to match tag before building.
          BUILD=$(grep '^version:' app_flutter/pubspec.yaml | sed 's/.*+\([0-9]*\).*/\1/')
          NEW_BUILD=$((BUILD + 1))
          sed -i "s/^version: .*/version: ${VERSION}+${NEW_BUILD}/" app_flutter/pubspec.yaml
          ./scripts/package-linux.sh "$VERSION"

      - name: Upload Linux tarball
        uses: actions/upload-artifact@v7
        with:
          name: comicrd-linux-x86_64
          path: dist/comicrd-*-linux-x86_64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows Bundle
    needs: quality
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native AVIF dependencies
        run: |
          choco install nasm pkgconfiglite -y
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
          }
          pip install meson

      - name: Build and install dav1d
        run: |
          $vsPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvarsPath = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "call `"$vcvarsPath`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              [System.Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            }
          }
          $prefix = ($env:RUNNER_TEMP -replace '\\', '/') + '/dav1d-install'
          git clone --depth 1 --branch 1.5.3 https://code.videolan.org/videolan/dav1d.git $env:RUNNER_TEMP\dav1d-build
          cd $env:RUNNER_TEMP\dav1d-build
          meson setup build --prefix=$prefix --buildtype release --default-library=static -Denable_tools=false -Denable_tests=false -Denable_docs=false
          meson compile -C build
          meson install -C build
          $env:PKG_CONFIG_PATH = "$prefix/lib/pkgconfig"
          pkg-config --exists dav1d
          if ($LASTEXITCODE -ne 0) {
            Write-Error "pkg-config could not find dav1d"
            exit 1
          }
          pkg-config --modversion dav1d
          pkg-config --libs dav1d
          echo "PKG_CONFIG_PATH=$env:PKG_CONFIG_PATH" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Fetch Flutter dependencies
        working-directory: app_flutter
        run: flutter pub get

      - name: Bump pubspec version to match tag
        shell: pwsh
        run: |
          $Version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          if ($Version -notmatch '^\d+\.\d+\.\d+([A-Za-z][0-9A-Za-z._]*|[-_][0-9A-Za-z][0-9A-Za-z._-]*)?$') {
            if ($env:GITHUB_REF -like 'refs/tags/*') {
              Write-Error ("Invalid tag: {0}. Expected vX.Y.Z" -f $env:GITHUB_REF_NAME)
              exit 1
            }
            $Version = "manual-${env:GITHUB_RUN_NUMBER}"
          }
          $Content = Get-Content app_flutter\pubspec.yaml -Raw
          $Match = [regex]::Match($Content, 'version:\s+(\d+\.\d+\.\d+)\+(\d+)')
          $OldBuild = [int]$Match.Groups[2].Value
          $NewBuild = $OldBuild + 1
          $Content = $Content -replace 'version:\s+\d+\.\d+\.\d+\+\d+', "version: ${Version}+${NewBuild}"
          Set-Content app_flutter\pubspec.yaml $Content -NoNewline

      - name: Build Windows release
        working-directory: app_flutter
        run: flutter build windows --release

      - name: Archive Windows bundle
        shell: pwsh
        run: |
          $Version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          if ($Version -notmatch '^\d+\.\d+\.\d+([A-Za-z][0-9A-Za-z._]*|[-_][0-9A-Za-z][0-9A-Za-z._-]*)?$') {
            if ($env:GITHUB_REF -like 'refs/tags/*') {
              Write-Error ("Invalid tag: {0}. Expected vX.Y.Z, vX.Y.Zsuffix, vX.Y.Z_suffix, or vX.Y.Z-suffix." -f $env:GITHUB_REF_NAME)
              exit 1
            }
            $Version = "manual-${env:GITHUB_RUN_NUMBER}"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path app_flutter/build/windows/x64/runner/Release/* `
            -DestinationPath "dist/comicrd-$Version-windows-x86_64.zip" `
            -Force

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v7
        with:
          name: comicrd-windows-x86_64
          path: dist/comicrd-*-windows-x86_64.zip
          if-no-files-found: error

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $Version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          if ($Version -notmatch '^\d+\.\d+\.\d+([A-Za-z][0-9A-Za-z._]*|[-_][0-9A-Za-z][0-9A-Za-z._-]*)?$') {
            if ($env:GITHUB_REF -like 'refs/tags/*') {
              Write-Error ("Invalid tag: {0}. Expected vX.Y.Z, vX.Y.Zsuffix, vX.Y.Z_suffix, or vX.Y.Z-suffix." -f $env:GITHUB_REF_NAME)
              exit 1
            }
            $Version = "manual-${env:GITHUB_RUN_NUMBER}"
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /D"AppVersion=$Version" "app_flutter\windows\installer\comicrd-setup.iss"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: comicrd-windows-installer
          path: dist/comicrd-*-windows-x86_64-setup.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS Bundle
    needs: quality
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native AVIF dependencies
        run: |
          brew install dav1d pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix dav1d)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Fetch Flutter dependencies
        working-directory: app_flutter
        run: flutter pub get

      - name: Bump pubspec version to match tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([A-Za-z][0-9A-Za-z._]*|[-_][0-9A-Za-z][0-9A-Za-z._-]*)?$'; then
            if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
              echo "Invalid tag: $GITHUB_REF_NAME. Expected vX.Y.Z"
              exit 1
            fi
            VERSION="manual-${GITHUB_RUN_NUMBER}"
          fi
          BUILD=$(grep '^version:' app_flutter/pubspec.yaml | sed 's/.*+\([0-9]*\).*/\1/')
          NEW_BUILD=$((BUILD + 1))
          sed -i '' "s/^version: .*/version: ${VERSION}+${NEW_BUILD}/" app_flutter/pubspec.yaml

      - name: Build macOS release
        working-directory: app_flutter
        run: |
          flutter pub get
          flutter build macos --release

      - name: Archive macOS bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([A-Za-z][0-9A-Za-z._]*|[-_][0-9A-Za-z][0-9A-Za-z._-]*)?$'; then
            if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
              echo "Invalid tag: $GITHUB_REF_NAME. Expected vX.Y.Z, vX.Y.Zsuffix, vX.Y.Z_suffix, or vX.Y.Z-suffix."
              exit 1
            fi
            VERSION="manual-${GITHUB_RUN_NUMBER}"
          fi
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            app_flutter/build/macos/Build/Products/Release/ComicRD.app \
            "dist/comicrd-${VERSION}-macos.zip"

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v7
        with:
          name: comicrd-macos
          path: dist/comicrd-*-macos.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - build-linux
      - build-windows
      - build-macos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release-upload
          find release-artifacts -type f \( \
            -name "*.tar.gz" -o \
            -name "*.zip" -o \
            -name "*.exe" \
          \) -exec cp -v {} release-upload/ \;
          ls -la release-upload
          test "$(find release-upload -maxdepth 1 -type f | wc -l)" -gt 0

      - name: Resolve release metadata
        id: release-metadata
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          name: ComicRD ${{ github.ref_name }}
          files: release-upload/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ steps.release-metadata.outputs.prerelease }}

      - name: Commit version bump
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Read the version that was actually built by the build jobs.
          # The build jobs already bumped pubspec.yaml before building,
          # but each job has its own checkout. We bump again here to
          # ensure the committed version matches the tag.
          BUILD=$(grep '^version:' app_flutter/pubspec.yaml | sed 's/.*+\([0-9]*\).*/\1/')
          NEW_BUILD=$((BUILD + 1))
          sed -i "s/^version: .*/version: ${VERSION}+${NEW_BUILD}/" app_flutter/pubspec.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app_flutter/pubspec.yaml
          git diff --cached --quiet && echo "No version change to commit" && exit 0
          git commit -m "chore: bump version to ${VERSION}+${NEW_BUILD} [skip ci]"
          git push

  publish-aur:
    name: Publish to AUR
    needs: release
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') && !contains(github.ref_name, '_')
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([A-Za-z][0-9A-Za-z._]*)?$'; then
            echo "Invalid tag: $TAG. Expected vX.Y.Z or vX.Y.Zsuffix."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Linux tarball checksum
        id: checksum
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/comicrd-${VERSION}-linux-x86_64.tar.gz"
          curl -fsSL "$URL" -o comicrd-linux.tar.gz
          SHA256="$(sha256sum comicrd-linux.tar.gz | awk '{print $1}')"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Install SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            HostName aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF

      - name: Clone AUR repository
        run: |
          set -euo pipefail
          git clone ssh://aur@aur.archlinux.org/comicrd-bin.git aur-repo

      - name: Generate PKGBUILD
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd aur-repo
          cat > PKGBUILD <<PKGEOF
          # Maintainer: Riski Andriyanto <putra7a@gmail.com>

          pkgname=comicrd-bin
          _pkgname=comicrd
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="ComicRD desktop comic reader built with Flutter and Rust"
          arch=('x86_64')
          url="https://github.com/${GITHUB_REPOSITORY}"
          license=('MIT')
          depends=(
            'gcc-libs'
            'glib2'
            'glibc'
            'gtk3'
            'hicolor-icon-theme'
            'libepoxy'
          )
          provides=('comicrd')
          conflicts=('comicrd')
          source=("\${_pkgname}-\${pkgver}-linux-x86_64.tar.gz::https://github.com/${GITHUB_REPOSITORY}/releases/download/v\${pkgver}/comicrd-\${pkgver}-linux-x86_64.tar.gz")
          sha256sums=('${SHA256}')

          package() {
            cp -R --no-preserve=ownership "\${srcdir}/comicrd-\${pkgver}-linux-x86_64/opt" "\${pkgdir}/"
            install -dm755 "\${pkgdir}/usr/bin"
            ln -sf /opt/comicrd/ComicRD "\${pkgdir}/usr/bin/comicrd"
            install -Dm644 "\${srcdir}/comicrd-\${pkgver}-linux-x86_64/usr/share/applications/com.andrizan.comicrd.desktop" "\${pkgdir}/usr/share/applications/com.andrizan.comicrd.desktop"
            install -Dm644 "\${srcdir}/comicrd-\${pkgver}-linux-x86_64/usr/share/icons/hicolor/512x512/apps/comicrd.png" "\${pkgdir}/usr/share/icons/hicolor/512x512/apps/comicrd.png"

            if [ -f "\${srcdir}/comicrd-\${pkgver}-linux-x86_64/usr/share/licenses/comicrd-bin/LICENSE" ]; then
              install -Dm644 "\${srcdir}/comicrd-\${pkgver}-linux-x86_64/usr/share/licenses/comicrd-bin/LICENSE" "\${pkgdir}/usr/share/licenses/comicrd-bin/LICENSE"
            fi
          }
          PKGEOF

      - name: Generate .SRCINFO
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/aur-repo:/aur-src:ro" \
            archlinux:latest \
            bash -lc "
              pacman -Syu --noconfirm base-devel >/dev/null &&
              useradd -m builder &&
              install -d -o builder -g builder /pkg &&
              install -m 644 /aur-src/PKGBUILD /pkg/PKGBUILD &&
              chown builder:builder /pkg/PKGBUILD &&
              su builder -c 'cd /pkg && makepkg --printsrcinfo'
            " > aur-repo/.SRCINFO
          cat aur-repo/.SRCINFO

      - name: Push to AUR
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd aur-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No AUR changes"
            exit 0
          fi
          git commit -m "Update to ${VERSION}"
          git push origin master
