name: "CodeQL"

on:
  # Only the Rust workspace is scanned, so a push or pull request that does
  # not touch it has nothing new to analyse; the weekly run covers the rest.
  push:
    branches: ["master"]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/codeql.yml"
      - ".github/actions/setup-toolchain/**"
  pull_request:
    branches: ["master"]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/codeql.yml"
      - ".github/actions/setup-toolchain/**"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    # CodeQL has no Dart support, so only the Rust workspace is scanned.
    name: Analyze (rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          flutter: "false"

      - name: Build Rust workspace
        run: cargo build --workspace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust"
