# git-cliff configuration: generates the GitHub release notes in
# .github/workflows/desktop-build.yml from Conventional Commits.
# Preview locally with: git cliff --latest --strip header

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
{% if commit.breaking %} **(breaking)**{% endif %} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/andrizan/comicRD/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}\
{% if version and previous.version %}\
**Full Changelog**: https://github.com/andrizan/comicRD/compare/{{ previous.version }}...{{ version }}
{% endif %}\
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Pre-convention commits still land in "Other" instead of vanishing.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  # Release plumbing, not user-facing.
  { message = "^chore: bump version", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "<!-- 00 -->Features" },
  { message = "^fix", group = "<!-- 01 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 02 -->Performance" },
  { message = "^refactor", group = "<!-- 03 -->Refactor" },
  { message = "^revert", group = "<!-- 04 -->Reverted" },
  { message = "^docs", group = "<!-- 05 -->Documentation" },
  { message = "^style", group = "<!-- 06 -->Style" },
  { message = "^test", group = "<!-- 07 -->Tests" },
  { message = "^(build|ci)", group = "<!-- 08 -->Build & CI" },
  { message = "^chore", group = "<!-- 09 -->Chores" },
  { message = ".*", group = "<!-- 10 -->Other" },
]
